name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # Keep check names stable: the main ruleset requires build & test (ubuntu).
    name: build & test (${{ matrix.check-name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check-name: ubuntu
          - os: macos-latest
            check-name: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Headers for better-sqlite3 in case its prebuilt binary doesn't match
      # the runner's Node ABI and it has to compile from source.
      - name: Install native build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: npm ci

      # Lint first so style/source violations fail fast, before the heavier
      # build and test steps. `npm run lint` runs the non-English source check
      # and then ESLint; ESLint fails the build on errors only, so the
      # pre-existing warning backlog does not block CI.
      - name: Lint
        run: npm run lint

      # Build the two TS packages. This invokes `tsc` which both type-checks
      # and emits; codey-mac is skipped here because its `build` script runs
      # electron-builder, which is heavy and only meaningful on macOS.
      - name: Build core
        run: npm run build -w @codey/core

      - name: Build gateway
        run: npm run build -w @codey/gateway

      # Type-check codey-mac without running electron-builder.
      - name: Type-check codey-mac
        run: npm run typecheck -w codey-mac

      - name: Test core
        run: npm test -w @codey/core

      - name: Test gateway
        run: npm test -w @codey/gateway

      - name: Test codey-mac
        run: npm test -w codey-mac

      # Compile renderer, main process, and preload without signing or publishing.
      - name: Bundle Electron app
        working-directory: codey-mac
        run: npx --no-install vite build

      # SwiftPM's shared cache in ~/Library/Caches can be missing on the runner,
      # which fails every package fetch. Keep the cache inside .build instead,
      # and retry the download a few times for flaky network.
      - name: Resolve voice helper packages
        if: runner.os == 'macOS'
        working-directory: voice
        run: |
          for attempt in 1 2 3; do
            swift package --cache-path .build/swiftpm-cache resolve && exit 0
            echo "Package resolve failed (attempt $attempt), retrying..."
            sleep 15
          done
          exit 1

      - name: Build macOS voice helper
        if: runner.os == 'macOS'
        env:
          SWIFT_FLAGS: --cache-path .build/swiftpm-cache
        run: npm run build:helper -w codey-mac
